name: Publish PHP74 Image

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified PHP 7.4 backport images to Docker Hub
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: php74-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare official PHP 7.4 source backport
        run: python3 php-fpm/prepare-php74-security-build.py "$RUNNER_TEMP/php74-build"

      - name: Build PHP 7.4 image
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/php74-build
          file: ${{ runner.temp }}/php74-build/Dockerfile
          platforms: linux/${{ matrix.arch }}
          pull: true
          no-cache: true
          load: true
          push: false
          tags: local/php74:verified-${{ matrix.arch }}

      - name: Verify backport, extensions, OOM behavior and FPM recovery
        env:
          IMAGE: local/php74:verified-${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          python3 php-fpm/verify-php-image.py "$IMAGE"
          mkdir -p "$RUNNER_TEMP/php74-artifact"
          docker run --rm --entrypoint php "$IMAGE" -r 'echo PHP_VERSION;' > "$RUNNER_TEMP/php74-artifact/version.txt"
          docker run --rm --entrypoint php "$IMAGE" -r 'echo getenv("PHP_SECURITY_BACKPORT");' > "$RUNNER_TEMP/php74-artifact/backport.txt"
          docker run --rm --entrypoint php "$IMAGE" -m > "$RUNNER_TEMP/php74-artifact/extensions.txt"
          docker image inspect --format '{{json .Config.Labels}}' "$IMAGE" > "$RUNNER_TEMP/php74-artifact/labels.json"
          cp "$RUNNER_TEMP/php74-build/Dockerfile" "$RUNNER_TEMP/php74-artifact/Dockerfile"
          docker save "$IMAGE" -o "$RUNNER_TEMP/php74-artifact/image.tar"
          echo "### Verified PHP 7.4.33 with official security backport / ${{ matrix.arch }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Extensions, Composer, direct OOM exit, session multipart parsing and FPM recovery passed. PHP 7.4 remains EOL." >> "$GITHUB_STEP_SUMMARY"

      - name: Save verified image
        uses: actions/upload-artifact@v4
        with:
          name: php74-verified-${{ matrix.arch }}
          path: ${{ runner.temp }}/php74-artifact/
          retention-days: 3
          compression-level: 1

  publish:
    if: inputs.publish == true
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download verified images
        uses: actions/download-artifact@v4
        with:
          pattern: php74-verified-*
          path: images

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Publish verified PHP 7.4 backport images
        shell: bash
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            test "$(cat "images/php74-verified-$arch/version.txt")" = 7.4.33
            test "$(cat "images/php74-verified-$arch/backport.txt")" = 712e60f9edfd03f0960fc4fc3c2c375f42b90aa2
            docker load -i "images/php74-verified-$arch/image.tar"
            docker tag "local/php74:verified-$arch" "kjlion/php:7.4-build-${GITHUB_RUN_ID}-$arch"
            docker push "kjlion/php:7.4-build-${GITHUB_RUN_ID}-$arch"
          done
          previous="$(docker buildx imagetools inspect kjlion/php:7.4-fpm-alpine --format '{{.Manifest.Digest}}')"
          docker buildx imagetools create -t "kjlion/php:7.4-rollback-${GITHUB_RUN_ID}" "kjlion/php@$previous"
          docker buildx imagetools create \
            -t kjlion/php:7.4.33-backport-712e60f-fpm-alpine \
            -t kjlion/php:7.4-fpm-alpine \
            "kjlion/php:7.4-build-${GITHUB_RUN_ID}-amd64" \
            "kjlion/php:7.4-build-${GITHUB_RUN_ID}-arm64"
          docker buildx imagetools inspect kjlion/php:7.4-fpm-alpine
          echo "Previous image digest: $previous" >> "$GITHUB_STEP_SUMMARY"
