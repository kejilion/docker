
name: Publish NGINX Image 

on:
  workflow_dispatch:   # 手动触发
  schedule:
    - cron: '0 0 1 * *'  # 每个月的1号00:00（UTC时间）

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Resolve latest component versions
        id: versions
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          github_api() {
            curl --retry 3 --retry-all-errors --connect-timeout 10 --max-time 60 -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/$1"
          }

          latest_release_tag() {
            github_api "repos/$1/releases/latest" | jq -er '.tag_name'
          }

          latest_default_branch_sha() {
            local repo="$1"
            local default_branch
            default_branch="$(github_api "repos/${repo}" | jq -er '.default_branch')"
            github_api "repos/${repo}/commits/${default_branch}" | jq -er '.sha'
          }

          normalize_version() {
            printf '%s\n' "$1" | sed -E 's/^(release-|v)//'
          }

          NGINX_VERSION="$(normalize_version "$(latest_release_tag nginx/nginx)")"
          MODSECURITY_VERSION="$(normalize_version "$(latest_release_tag owasp-modsecurity/ModSecurity)")"
          MODSECURITY_NGINX_VERSION="$(normalize_version "$(latest_release_tag owasp-modsecurity/ModSecurity-nginx)")"
          ZSTD_VERSION="$(normalize_version "$(latest_release_tag facebook/zstd)")"
          CORERULESET_VERSION="$(normalize_version "$(latest_release_tag coreruleset/coreruleset)")"
          NGX_BROTLI_REF="$(latest_default_branch_sha google/ngx_brotli)"
          ZSTD_NGINX_MODULE_REF="$(latest_default_branch_sha tokers/zstd-nginx-module)"
          WORDPRESS_PLUGIN_REF="$(latest_default_branch_sha coreruleset/wordpress-rule-exclusions-plugin)"
          LDNMP_RULES_REF="$(latest_default_branch_sha kejilion/nginx)"

          {
            echo "nginx_version=${NGINX_VERSION}"
            echo "modsecurity_version=${MODSECURITY_VERSION}"
            echo "modsecurity_nginx_version=${MODSECURITY_NGINX_VERSION}"
            echo "zstd_version=${ZSTD_VERSION}"
            echo "coreruleset_version=${CORERULESET_VERSION}"
            echo "ngx_brotli_ref=${NGX_BROTLI_REF}"
            echo "zstd_nginx_module_ref=${ZSTD_NGINX_MODULE_REF}"
            echo "wordpress_plugin_ref=${WORDPRESS_PLUGIN_REF}"
            echo "ldnmp_rules_ref=${LDNMP_RULES_REF}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Resolved NGINX image components"
            echo
            echo "- NGINX: ${NGINX_VERSION}"
            echo "- ModSecurity: ${MODSECURITY_VERSION}"
            echo "- ModSecurity-nginx: ${MODSECURITY_NGINX_VERSION}"
            echo "- OWASP CRS: ${CORERULESET_VERSION}"
            echo "- Zstandard: ${ZSTD_VERSION}"
            echo "- ngx_brotli: ${NGX_BROTLI_REF}"
            echo "- zstd-nginx-module: ${ZSTD_NGINX_MODULE_REF}"
            echo "- WordPress CRS plugin: ${WORDPRESS_PLUGIN_REF}"
            echo "- LDNMP rules: ${LDNMP_RULES_REF}"
          } >> "$GITHUB_STEP_SUMMARY"


      - name: Build and push NGINX image 
        uses: docker/build-push-action@v7
        with:
          context: .
          file: nginx/Dockerfile-waf
          push: true
          tags: kjlion/nginx:alpine
          platforms: linux/amd64,linux/arm64
          build-args: |
            NGINX_VERSION=${{ steps.versions.outputs.nginx_version }}
            MODSECURITY_VERSION=${{ steps.versions.outputs.modsecurity_version }}
            MODSECURITY_NGINX_VERSION=${{ steps.versions.outputs.modsecurity_nginx_version }}
            ZSTD_VERSION=${{ steps.versions.outputs.zstd_version }}
            CORERULESET_VERSION=${{ steps.versions.outputs.coreruleset_version }}
            NGX_BROTLI_REF=${{ steps.versions.outputs.ngx_brotli_ref }}
            ZSTD_NGINX_MODULE_REF=${{ steps.versions.outputs.zstd_nginx_module_ref }}
            WORDPRESS_PLUGIN_REF=${{ steps.versions.outputs.wordpress_plugin_ref }}
            LDNMP_RULES_REF=${{ steps.versions.outputs.ldnmp_rules_ref }}
