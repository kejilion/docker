name: Publish NGINX Image

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified images to Docker Hub
        type: boolean
        default: false
      verified_run_id:
        description: Reuse verified artifacts from a successful run of this exact commit
        type: string
        default: ''
  schedule:
    - cron: '0 0 1 * *'  # 每月 1 日 00:00 UTC

permissions:
  contents: read
  actions: read

concurrency:
  group: nginx-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    if: inputs.verified_run_id == ''
    runs-on: ubuntu-24.04
    outputs:
      nginx_version: ${{ steps.versions.outputs.nginx_version }}
      modsecurity_version: ${{ steps.versions.outputs.modsecurity_version }}
      modsecurity_nginx_version: ${{ steps.versions.outputs.modsecurity_nginx_version }}
      zstd_version: ${{ steps.versions.outputs.zstd_version }}
      coreruleset_version: ${{ steps.versions.outputs.coreruleset_version }}
      ngx_brotli_ref: ${{ steps.versions.outputs.ngx_brotli_ref }}
      zstd_nginx_module_ref: ${{ steps.versions.outputs.zstd_nginx_module_ref }}
      wordpress_plugin_ref: ${{ steps.versions.outputs.wordpress_plugin_ref }}
      ldnmp_rules_ref: ${{ steps.versions.outputs.ldnmp_rules_ref }}
    steps:
      - name: Resolve latest component versions
        id: versions
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          github_api() {
            curl --retry 3 --retry-all-errors --connect-timeout 10 --max-time 60 -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/$1"
          }

          latest_release_tag() {
            github_api "repos/$1/releases/latest" | jq -er '.tag_name'
          }

          latest_default_branch_sha() {
            local repo="$1"
            local default_branch
            default_branch="$(github_api "repos/${repo}" | jq -er '.default_branch')"
            github_api "repos/${repo}/commits/${default_branch}" | jq -er '.sha'
          }

          normalize_version() {
            printf '%s\n' "$1" | sed -E 's/^(release-|v)//'
          }

          NGINX_VERSION="$(normalize_version "$(latest_release_tag nginx/nginx)")"
          MODSECURITY_VERSION="$(normalize_version "$(latest_release_tag owasp-modsecurity/ModSecurity)")"
          MODSECURITY_NGINX_VERSION="$(normalize_version "$(latest_release_tag owasp-modsecurity/ModSecurity-nginx)")"
          ZSTD_VERSION="$(normalize_version "$(latest_release_tag facebook/zstd)")"
          CORERULESET_VERSION="$(normalize_version "$(latest_release_tag coreruleset/coreruleset)")"
          NGX_BROTLI_REF="$(latest_default_branch_sha google/ngx_brotli)"
          ZSTD_NGINX_MODULE_REF="$(latest_default_branch_sha tokers/zstd-nginx-module)"
          WORDPRESS_PLUGIN_REF="$(latest_default_branch_sha coreruleset/wordpress-rule-exclusions-plugin)"
          LDNMP_RULES_REF="$(latest_default_branch_sha kejilion/nginx)"

          {
            echo "nginx_version=${NGINX_VERSION}"
            echo "modsecurity_version=${MODSECURITY_VERSION}"
            echo "modsecurity_nginx_version=${MODSECURITY_NGINX_VERSION}"
            echo "zstd_version=${ZSTD_VERSION}"
            echo "coreruleset_version=${CORERULESET_VERSION}"
            echo "ngx_brotli_ref=${NGX_BROTLI_REF}"
            echo "zstd_nginx_module_ref=${ZSTD_NGINX_MODULE_REF}"
            echo "wordpress_plugin_ref=${WORDPRESS_PLUGIN_REF}"
            echo "ldnmp_rules_ref=${LDNMP_RULES_REF}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Resolved NGINX image components"
            echo
            echo "- NGINX: ${NGINX_VERSION}"
            echo "- ModSecurity: ${MODSECURITY_VERSION}"
            echo "- ModSecurity-nginx: ${MODSECURITY_NGINX_VERSION}"
            echo "- OWASP CRS: ${CORERULESET_VERSION}"
            echo "- Zstandard: ${ZSTD_VERSION}"
            echo "- ngx_brotli: ${NGX_BROTLI_REF}"
            echo "- zstd-nginx-module: ${ZSTD_NGINX_MODULE_REF}"
            echo "- WordPress CRS plugin: ${WORDPRESS_PLUGIN_REF}"
            echo "- LDNMP rules: ${LDNMP_RULES_REF}"
          } >> "$GITHUB_STEP_SUMMARY"



  build:
    if: inputs.verified_run_id == ''
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify optional optimization does not block upstream upgrades
        run: sh nginx/test-modsecurity-optimization.sh

      - name: Build NGINX image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: nginx/Dockerfile-waf
          platforms: linux/${{ matrix.arch }}
          pull: true
          no-cache: true
          load: true
          push: false
          tags: local/nginx:verified-${{ matrix.arch }}
          build-args: |
            NGINX_VERSION=${{ needs.resolve.outputs.nginx_version }}
            MODSECURITY_VERSION=${{ needs.resolve.outputs.modsecurity_version }}
            MODSECURITY_NGINX_VERSION=${{ needs.resolve.outputs.modsecurity_nginx_version }}
            ZSTD_VERSION=${{ needs.resolve.outputs.zstd_version }}
            CORERULESET_VERSION=${{ needs.resolve.outputs.coreruleset_version }}
            NGX_BROTLI_REF=${{ needs.resolve.outputs.ngx_brotli_ref }}
            ZSTD_NGINX_MODULE_REF=${{ needs.resolve.outputs.zstd_nginx_module_ref }}
            WORDPRESS_PLUGIN_REF=${{ needs.resolve.outputs.wordpress_plugin_ref }}
            LDNMP_RULES_REF=${{ needs.resolve.outputs.ldnmp_rules_ref }}

      - name: Verify NGINX modules, HTTP and WAF
        env:
          IMAGE: local/nginx:verified-${{ matrix.arch }}
          NGINX_VERSION: ${{ needs.resolve.outputs.nginx_version }}
          COMPONENTS: ${{ toJSON(needs.resolve.outputs) }}
        shell: bash
        run: |
          set -euo pipefail
          bash nginx/verify-image.sh "$IMAGE" "$NGINX_VERSION"
          mkdir -p "$RUNNER_TEMP/nginx-artifact"
          printf '%s' "$NGINX_VERSION" > "$RUNNER_TEMP/nginx-artifact/version.txt"
          optimization="$(docker run --rm --network none --entrypoint cat "$IMAGE" /usr/share/doc/kejilion-waf/modsecurity-optimization.json)"
          printf '%s\n' "$COMPONENTS" | jq --argjson optimization "$optimization" \
            '. + {modsecurity_target_optimization: $optimization}' > "$RUNNER_TEMP/nginx-artifact/components.json"
          docker save "$IMAGE" -o "$RUNNER_TEMP/nginx-artifact/image.tar"
          echo "### Verified NGINX $NGINX_VERSION / ${{ matrix.arch }}" >> "$GITHUB_STEP_SUMMARY"
          echo "All modules, configuration, HTTP and WAF checks passed." >> "$GITHUB_STEP_SUMMARY"
          echo "Optional target matching optimization: $optimization" >> "$GITHUB_STEP_SUMMARY"

      - name: Save verified image
        uses: actions/upload-artifact@v4
        with:
          name: nginx-verified-${{ matrix.arch }}
          path: ${{ runner.temp }}/nginx-artifact/
          retention-days: 3
          compression-level: 1

  publish:
    if: >-
      always() &&
      (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.verified_run_id != '')) &&
      (github.event_name == 'schedule' || inputs.publish == true)
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Validate source run before reusing artifacts
        if: inputs.verified_run_id != ''
        uses: actions/github-script@v7
        env:
          VERIFIED_RUN_ID: ${{ inputs.verified_run_id }}
        with:
          script: |
            if (!/^[0-9]+$/.test(process.env.VERIFIED_RUN_ID)) {
              throw new Error('Invalid verified run ID');
            }
            const params = { owner: context.repo.owner, repo: context.repo.repo };
            const source = (await github.rest.actions.getWorkflowRun({
              ...params, run_id: Number(process.env.VERIFIED_RUN_ID)
            })).data;
            const current = (await github.rest.actions.getWorkflowRun({
              ...params, run_id: context.runId
            })).data;
            if (source.conclusion !== 'success' || source.head_sha !== context.sha ||
                source.workflow_id !== current.workflow_id ||
                source.head_repository?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              throw new Error('Artifacts must come from a successful run of this workflow and exact commit');
            }

      - name: Download verified images
        uses: actions/download-artifact@v4
        with:
          pattern: nginx-verified-*
          path: images
          run-id: ${{ inputs.verified_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Publish verified images and multi-platform manifest
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat images/nginx-verified-amd64/version.txt)"
          test "$version" = "$(cat images/nginx-verified-arm64/version.txt)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          for arch in amd64 arm64; do
            docker load -i "images/nginx-verified-$arch/image.tar"
            docker tag "local/nginx:verified-$arch" "kjlion/nginx:build-${GITHUB_RUN_ID}-$arch"
            docker push "kjlion/nginx:build-${GITHUB_RUN_ID}-$arch"
          done
          docker buildx imagetools create \
            -t "kjlion/nginx:${version}-alpine" \
            -t kjlion/nginx:alpine \
            "kjlion/nginx:build-${GITHUB_RUN_ID}-amd64" \
            "kjlion/nginx:build-${GITHUB_RUN_ID}-arm64"
          docker buildx imagetools inspect kjlion/nginx:alpine
